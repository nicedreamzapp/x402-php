<svg xmlns="http://www.w3.org/2000/svg" width="560" height="238" viewBox="0 0 560 238" role="img" aria-label="402 Payment Required. You answer an agent with your price, asset, network and wallet. Agent signs and retries. The signature goes in a PAYMENT-SIGNATURE header. Verify, serve, settle. A facilitator checks it, then money moves wallet to wallet."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="293.4" height="148" rx="10"/></clipPath><rect width="293.4" height="148" rx="10" fill="url(#n)"/><rect width="293.4" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="292.4" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="149" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">1️⃣ 402 Payment Required</text><text x="149" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">You answer an agent with your</text><text x="149" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">price, asset, network and wallet.</text></g><g transform="translate(303.4,0)"><clipPath id="c0_1"><rect width="256.6" height="148" rx="10"/></clipPath><rect width="256.6" height="148" rx="10" fill="url(#n)"/><rect width="256.6" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="255.6" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="130" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">2️⃣ Agent signs and</text><text x="130" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#decdd4">retries</text><text x="130" text-anchor="middle" y="88" font-size="16" font-weight="500" fill="#f2f5fa">The signature goes in a</text><text x="130" text-anchor="middle" y="111" font-size="16" font-weight="500" fill="#f2f5fa">PAYMENT-SIGNATURE</text><text x="130" text-anchor="middle" y="133" font-size="16" font-weight="500" fill="#f2f5fa">header.</text></g><g transform="translate(0.0,158)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#8a4f68" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">3️⃣ Verify, serve, settle</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">A facilitator checks it, then money moves wallet to wallet.</text></g></g></svg>
