<svg xmlns="http://www.w3.org/2000/svg" width="820" height="157" viewBox="0 0 820 157" role="img" aria-label="402 Payment Required. You answer an agent with your price, asset, network and wallet. Agent signs and retries. The signature goes in a PAYMENT-SIGNATURE header. Verify, serve, settle. A facilitator checks it, then money moves wallet to wallet."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="274.5" height="157" rx="10"/></clipPath><rect width="274.5" height="157" rx="10" fill="url(#n)"/><rect width="274.5" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="273.5" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="139" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">1️⃣ 402 Payment</text><text x="139" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#decdd4">Required</text><text x="139" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">You answer an agent with</text><text x="139" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">your price, asset, network and</text><text x="139" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">wallet.</text></g><g transform="translate(286.5,0)"><clipPath id="c0_1"><rect width="274.5" height="157" rx="10"/></clipPath><rect width="274.5" height="157" rx="10" fill="url(#n)"/><rect width="274.5" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="273.5" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="139" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">2️⃣ Agent signs and</text><text x="139" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#decdd4">retries</text><text x="139" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">The signature goes in a</text><text x="139" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">PAYMENT-SIGNATURE</text><text x="139" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">header.</text></g><g transform="translate(573.1,0)"><clipPath id="c0_2"><rect width="246.9" height="157" rx="10"/></clipPath><rect width="246.9" height="157" rx="10" fill="url(#n)"/><rect width="246.9" height="4" fill="#8a4f68" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="245.9" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="125" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">3️⃣ Verify, serve,</text><text x="125" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#decdd4">settle</text><text x="125" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">A facilitator checks it, then</text><text x="125" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">money moves wallet to</text><text x="125" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">wallet.</text></g></g></svg>
